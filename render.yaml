# Render.com deployment configuration
# See: https://render.com/docs/blueprint-spec

services:
  # --- FastAPI Backend ---
  - type: web
    name: firefiles-api
    runtime: python
    rootDir: backend
    buildCommand: "pip install -r requirements.txt"
    startCommand: "gunicorn app.main:app --workers 2 --worker-class uvicorn.workers.UvicornWorker --bind 0.0.0.0:$PORT"
    envVars:
      - key: DATABASE_URL
        value: "sqlite:///./firefiles.db"
      - key: ENVIRONMENT
        value: production
      - key: CORS_ORIGINS
        sync: false  # Set manually to deployed frontend URL
      - key: JWT_SECRET
        generateValue: true
      - key: PYTHON_VERSION
        value: "3.12"

  # --- Next.js Frontend ---
  - type: web
    name: firefiles-web
    runtime: node
    rootDir: frontend
    buildCommand: "npm install && npm run build"
    startCommand: "npm start"
    envVars:
      - key: NEXT_PUBLIC_API_URL
        sync: false  # Set manually to deployed backend URL
      - key: NODE_VERSION
        value: "20"
